    <section id="contacto" class="container py-5">
        <h1 class="display-4 fw-bold text-center text-danger"> Contáctame </h1>
        <p class="fs-5 text-center"> ¿Te gustaría conocer más sobre mis proyectos? ¡Envíame un mensaje! </p>
        <div class="row py-4">
            <article class="col-lg-6 mb-4">
                <h2 class="fw-bold"> Mándame un mensaje </h2>
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label"> Nombre </label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                    </div>


                    <div class="mb-3">
                        <label for="correo" class="form-label"> Correo electrónico </label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="Escribe tu correo electrónico" required>
                    </div>

                    <div class="mb-3">
                        <label for="mensaje" class="form-label"> Mensaje </label>
                        <textarea class="form-control" id="mensaje"name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Enviar mensaje
                    </button>
                </form>
            </article>
            <article class="col-lg-6 mb-4">
                <h2 class="fw-bold"> Mi ubicación</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3720.864151994416!2d-101.69776962495233!3d21.157803880523954!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842bbf471573b9c9%3A0x131d3a2e05f53779!2sPlaza%20Mayor!5e0!3m2!1ses-419!2smx!4v1792962495133!5m2!1ses-419!2smx" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </article>
        </div>
    </section>
